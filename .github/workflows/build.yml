name: Build Action

on:
  push:
    branches: [ master, develop ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Publish CommandsAPI
    uses: GroupeZ-dev/actions/.github/workflows/build.yml@main
    with:
      # Gradle 8.14 (gradle/wrapper/gradle-wrapper.properties) supports Java 24 at most:
      # the shared workflow now defaults to Java 25, which fails while compiling the build
      # scripts. Pin the toolchain to the version the project targets.
      java-version: "21"
      default-branch: "master"
      project-name: "CommandsAPI"
      publish: true
      publish-on-discord: false
      project-to-publish: "publishAll"
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      WEBHOOK_URL: ""
